org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# flutter_facebook_auth compiles its Java at 1.8 and Kotlin at 17; newer Kotlin Gradle plugins
# fail the build on that mismatch. A warning is enough here: both targets run fine on Android.
kotlin.jvm.target.validation.mode=warning

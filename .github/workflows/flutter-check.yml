name: Flutter check & test build

# Runs on every push to a release branch (and can be started by hand).
# Checks the code compiles, runs unit tests, and builds an Android APK for testing on a phone.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version | tee step.log

      - name: Get packages
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee step.log

      - name: Analyze (errors fail the build; warnings are reported)
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee step.log

      - name: Unit tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee step.log

      - name: Build test APK (debug-signed, for testing only)
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee step.log

      # If any step fails, publish the end of its output as an annotation on the commit,
      # so the error can be read without opening the Actions log.
      - name: Report failure output
        if: failure()
        run: |
          tail -n 60 step.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
          echo "::error title=Failed step output::$(cat tail.txt)"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rrc-app-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

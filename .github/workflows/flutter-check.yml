name: Flutter check & test build

# Runs on every push to a release branch (and can be started by hand).
# Checks the code compiles, runs unit tests, and builds an Android APK for testing on a phone.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish the test APK to the test-builds branch

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version | tee step.log

      - name: Get packages
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee step.log

      - name: Analyze (errors fail the build; warnings are reported)
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee step.log

      - name: Unit tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee step.log

      - name: Build test APK (installs next to the store app as "Reliiance TEST")
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --android-project-arg=rrcTestBuild=true 2>&1 | tee step.log

      # Publish the APKs to the test-builds branch (one commit per build, previous builds replaced)
      - name: Publish test APK
        run: |
          set -e
          short=$(git rev-parse --short HEAD)
          ver=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p /tmp/out
          for abi in arm64-v8a armeabi-v7a; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk /tmp/out/reliiance-test-$ver-$short-$abi.apk
          done
          printf 'Built from %s (%s) on %s\nInstall the arm64-v8a file on almost all phones made since 2017.\n' "$GITHUB_REF_NAME" "$short" "$(date -u +%FT%TZ)" > /tmp/out/README.txt
          cd /tmp/out
          git init -q -b test-builds
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Test APK $ver ($short)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-builds

      # If any step fails, publish the end of its output as an annotation on the commit,
      # so the error can be read without opening the Actions log.
      - name: Report failure output
        if: failure()
        run: |
          tail -n 60 step.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
          echo "::error title=Failed step output::$(cat tail.txt)"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rrc-app-test-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
